[project]
name = "trellis2-lowvram"
version = "0.1.0.dev0"
description = "Unofficial wrapper to install and run Microsoft TRELLIS.2 on 16GB consumer NVIDIA GPUs"
readme = "README.md"
license = "MIT"
requires-python = "==3.11.*"
dependencies = [
    # GPU stack: PyTorch 2.8 + CUDA 12.8 (first line with RTX 50 / sm_120 support)
    "torch==2.8.0",
    "torchvision==0.23.0",
    "xformers==0.0.32.post2",
    # FlexGEMM kernels are Triton; Windows uses the triton-windows build
    "triton==3.4.0; sys_platform == 'linux'",
    "triton-windows==3.4.0.post21; sys_platform == 'win32'",
    # transformers 4.57.3: DINOv3ViTModel API that upstream calls directly
    "transformers==4.57.3",
    "huggingface-hub",
    "safetensors",
    "numpy",
    "pillow",
    "opencv-python-headless",
    "trimesh",
    "easydict",
    "tqdm",
    "plyfile",
    "zstandard",
    "kornia",
    "timm",
    # BiRefNet (background removal) remote code imports einops
    "einops",
    # faster Hugging Face downloads (Xet storage); without it hub falls back to plain HTTP
    "hf-xet",
    # environment checks that run without torch
    "nvidia-ml-py",
    "psutil",
]

[project.scripts]
trellis2-lowvram = "trellis2_lowvram.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trellis2_lowvram"]

[tool.uv]
# Never pick up a system/conda Python: its bundled libstdc++ can be older than our wheels need.
python-preference = "only-managed"
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
xformers = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
